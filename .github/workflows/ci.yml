name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        beancount: ["3.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test against beancount ${{ matrix.beancount }}
        run: |
          if [ "${{ matrix.beancount }}" = latest ]; then spec="beancount>=3,<4"; else spec="beancount==${{ matrix.beancount }}"; fi
          uv run --isolated --python "${{ matrix.python }}" --with "$spec" --with pytest --with-editable . pytest -q
