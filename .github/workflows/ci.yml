name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Pinned so a ruff release can't turn CI red with no code change.
      - run: uvx ruff@0.17.0 check .
      - run: uvx ruff@0.17.0 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        beancount: ["3.0.0", "latest"]
        exclude:
          # beancount 3.0.0 has no wheels for these; it would build from source.
          - python: "3.13"
            beancount: "3.0.0"
          - python: "3.14"
            beancount: "3.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test against beancount ${{ matrix.beancount }}
        run: |
          if [ "${{ matrix.beancount }}" = latest ]; then spec="beancount>=3,<4"; else spec="beancount==${{ matrix.beancount }}"; fi
          uv run --isolated --python "${{ matrix.python }}" --with "$spec" --with pytest --with-editable . pytest -q
