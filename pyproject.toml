[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beancount-options"
version = "0.1.0"
description = "Beancount plugins that check option contracts (expiry, assignment basis)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["beancount>=3.0,<4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/rustledger/beancount-options"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_options"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
